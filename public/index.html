<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GN-Math Crawler</title><style>body{font-family:system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#f7f7fb}table{width:100%;border-collapse:collapse;background:white}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.card{background:white;padding:18px;border-radius:14px;margin:15px 0}code{background:#eee;padding:3px}</style></head><body><h1>GN-Math Game Source Crawler</h1><p>Technical source evidence for eaglercraftgame.io.</p><div class="card"><b>Run:</b> GitHub → Actions → GN-Math Game Source Crawler → Run workflow. Start with Minecraft + 5 games.</div><div class="card"><h2>Latest scan</h2><div id="x">Loading...</div></div><script>fetch('/results/master.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('No results yet');return r.json()}).then(d=>{let h='<p>'+d.count+' games</p><table><tr><th>Game</th><th>Category</th><th>Type</th><th>Game URL</th><th>Hosts</th><th>Status</th></tr>';for(const x of d.games||[]){h+='<tr><td>'+e(x.game?.name)+'</td><td>'+e(x.game?.category)+'</td><td>'+e(x.embed?.game_type)+'</td><td>'+e(x.embed?.url_game)+'</td><td>'+e((x.game_hosts||[]).map(a=>a.host).join(', '))+'</td><td>'+e(x.status)+'</td></tr>'}document.querySelector('#x').innerHTML=h+'</table>'}).catch(e=>document.querySelector('#x').textContent=e.message);function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
